<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Tính tổng của 30 số chia hết cho 7 đầu tiên trong các số tự nhiên
        let sum = 0;
        let count = 0;
        let number = 1;

        while (count < 30) {
            if (number % 7 === 0) {
                sum += number;
                count++;
            }
            number++;
        }

        console.log("Tổng của 30 số tự nhiên đầu tiên chia hết cho 7 là: " + sum);
        // alert("Tổng của 30 số tự nhiên đầu tiên chia hết cho 7 là: " + sum);
    </script>
</body>
</html>
